# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: Optimal one-runner extension of a fixed shifted configuration
  description: >-
    Keeping the speeds and phases of a published 57-runner shifted lonely runner
    configuration fixed, the least covering radius attainable by adding one
    runner of distinct positive integer speed and arbitrary real phase is
    1359451/79000000 turns. Speed 528344 and phase 4737613/31600000 attain the
    bound. If each of the original phases moves by at most 1207609/4661000000
    turns on the circle while the speeds stay fixed, then every additional
    runner of positive integer speed has a time when all 58 runners are at
    distance at least 1/59 from the origin.
  authors: [Chengyi Fang]
  responsible_maintainers: [Chengyi Fang]
  license: MIT
classification:
  arxiv: [math.CO]
  msc2020: [11J71]
sources:
  - title: Optimal one-runner extension of a fixed shifted configuration
    type: original-proof
    relationship: other
    note: The new results optimize the additional runner conditional on a fixed published seed.
  - title: Shifted lonely runner counterexamples, published configurations for sizes 18–57
    type: other
    id: https://github.com/1337isnot1337/solved-conjectures/blob/75a0b27a1b3e76715a45704865454b14f8f1c63d/results/shifted-lonely-runner-counterexamples/certificates.json
    contributors:
      - name: tomdif
        role: Contributed the 57-runner seed used here
      - name: aadrianvv
        role: Contributed the earlier configurations and search tooling
    relationship: background
    note: The 57-runner speeds and phases are preserved exactly.
    license: MIT
  - title: Coloopless zonotopes and counterexamples to the Shifted Lonely Runner Conjecture
    type: paper
    authors: [Mónica Blanco, Francisco Criado, Francisco Santos]
    id: https://arxiv.org/abs/2603.24784v4
    relationship: background
  - title: More (shifted) runners, less loneliness
    type: paper
    authors: [Daria Poliakova]
    id: https://arxiv.org/abs/2609.23952v1
    relationship: background
  - title: "Tight instances of the Lonely Runner Conjecture: one-entry modifications and the growth of speeds"
    type: paper
    authors: [Yuhan Zhang]
    id: https://arxiv.org/abs/2608.13599v3
    relationship: background
related_formalizations:
  - id: https://github.com/1337isnot1337/solved-conjectures/blob/60e47a0419d97deb104e72eb23692232430ce35f/results/shifted-lonely-runner-counterexamples/FORMALIZATION.md
    relationship: builds-on
    note: >
      The upstream work verifies the seed configuration. The present proof adapts its
      closed-arc covering checker and adds the lower certificate for an arbitrary extension.
status:
  scope: >-
    The main theorem fixes all 57 original speeds and phases. The perturbation theorem
    fixes their speeds. The classification of every attaining phase and speed is supported
    separately by an exact integer enumeration outside Lean. The supporting library also
    contains a generic phase-grid equivalence and the integer counting layer of a separate
    packing result.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
