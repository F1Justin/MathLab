      cost:
        spend_usd: Subscription-based usage
  spend_usd: "1.992664 in completed Lean-specific API calls, plus subscription-based and broader research usage"
  notes: The maintainer directed the research and release. The formalization and mathematical checks were performed with automated assistance. Human understanding of the complete proof is recorded as none.
fidelity:
  divergences: >-
    The paper and repository sources above supply context, the original seed, and a reusable
    covering checker. The claimed exact optimum is for that seed with one additional runner.
