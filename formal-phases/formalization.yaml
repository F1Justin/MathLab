    relationship: background
    note: Derives necessary short integer relations among the velocities for small shifted gap.
status:
  scope: >-
    Both general theorems, including strict failure in every enlarged cube,
    are proved. The orbit distance is the attained infimum over shifts. The
    tube statement is a sufficient-radius result. The minimum over all
    phases and the exact boundary of the strict-improvement set are outside
    this formalization.
