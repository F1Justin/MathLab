version: v0.4
project:
  name: A sharp phase neighbourhood for consecutive lonely runners
  description: >-
    For every prime p at least 7 and the speeds 1 through p−1, the gap near
    common start equals 1/p plus the maximum of the absolute values of
    explicit complementary-pair linear forms. This identity holds on the
    closed cube of radius 1/(2Q(p+1)), where Q is the largest odd integer
    strictly below (p+1)/2. Every larger centred cube contains a phase vector
    at which the gap is strictly larger than the formula predicts. If 2 has
    odd order modulo p up to sign, the gap is at least 1/p everywhere within
    circle distance 2(p+1)/(p(3p−1)) of the common-start orbit, using the
    maximum over coordinates and minimizing over common time shifts.
  authors: [Chengyi Fang]
  responsible_maintainers: [Chengyi Fang]
  license: MIT
