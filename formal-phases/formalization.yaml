fidelity:
  divergences: >-
    The Lean statement writes the two time extrema as a real supremum and
    infimum, the latter with circular coordinate distances. Geometry.lean
    proves attainment on [0,1] and equality of the half-index and all-index
    versions of the complementary-pair maximum. The order condition is the
    least positive exponent for which 2^n is congruent to 1 or −1. It is
    verified to be odd exactly when an odd positive such exponent exists.
    The paper's separate observation that p congruent to 3 modulo 4 implies
    this order condition uses the order of the quotient unit group.
